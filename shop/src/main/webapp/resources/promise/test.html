<meta charset="UTF-8">
<script>
	/*
		전통적인 자바스크립트로 콜백을 중첩해 나가다 보면, 콜백처리 코드가 복잡해진다.. (콜백 지옥이라 함)
		현재 프런트 앤드 분야에서 이 문제를 해결하기 위해 ES6부터는 Promise가 도입되어 많이 사용됨
		
		전통적인 콜백 중첩 방식의 문제점
		- 콜백 안에 콜백이 중첩되어 코드가 복잡해지고, 유지보수성이 떨어짐
		- 예외처리가 java처럼 하나의 catch 블럭으로 통일되어질 수 없음.
		
		해결책) Promise의 적극 도입 및 활용
		
		Promise 란?
			- 비동기 처리 실행 시 미래에 대한 약속 처리 객체
		Promise 객체의 상태값
			Promise는 미래의 비동기작업 업무의 상태를 보관할 수 있는데, 아래와 같이 3가지 유형의 값을 갖는다.
			- pending : 아직 완료되지 않은 상태 (default)
			- fulfilled : 비동기 업무가 성공했을 때 갖는 값
			- rejected : 비동기 업무가 실패했을 때 갖는 값 
	*/
	
	// new Promise(function(resolve(성공할 때 함수), reject(실패할 때 함수)){
	let p = new Promise(function(resolve, reject){
		// 비동기로 처리하고픈 코드 작성....
		
		setTimeout(function(){
			resolve();	// pending -> 1초 뒤에 fulfilled 
		}, 1000);
		
		// 만일 비동기 요청의 내용이 네트워크 작업일 경우?
		// 서버의 응답 정보를 성공적으로 가져왔는지, 실패하였는지 따져보아야 한다..
		
		//resolve();		// 첫 번째 매개변수로 전달된 함수를 호출했으므로, Promise의 상태를 fulfilled로 놓게 됨
		// resolve() 를 호출하면, 비동기 코드가 완료되었을 때 Promise가 보유한 then() 메서드를 자동 호출하게 됨..
		// reject()를 호출하면, 비동기 코드가 완료되었을 때 Promise가 보유한 catch() 메서드를 자동 호출하게 됨..
		
	});
	
	p.then(function(){
		console.log("비동기 업무가 성공했네요..");	
	});
	
	p.catch(function(){
		console.log("비동기 업무가 실패했네요..")
	});
	
	
	/* 
		비동기 함수 setTimeout이 1초 뒤에 실행됨 A - B - C
		console.log("A");
		setTimeout(function(){
			console.log("C");
		}, 1000);
		console.log("B");
	*/
	
</script>
